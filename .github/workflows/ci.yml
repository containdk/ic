---
name: CI

on:
  push:
    tags:
      - v*
  pull_request:
    branches:
      - main

permissions:
  actions: write
  contents: write
  packages: write
  pull-requests: write

jobs:
  build:
    name: Build and Test
    uses: neticdk/shared-github-actions/.github/workflows/go-ci.yaml@0f94f62339cec974c8d6febed7b49165d62d0719 # v0.9.0
    with:
      run-benchmarks: true
      run-release-test: false
      run-govulncheck: true
      govulncheck-fail: true
      govulncheck-fail-without-fix: true
    secrets: inherit

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true

  distribute:
    uses: ./.github/workflows/cd.yaml
    if: startsWith(github.ref, 'refs/tags/')
    needs: release
    secrets: inherit
